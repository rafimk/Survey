services:
  # Primary Keycloak instance: http://localhost:8080, realm razor-primary.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-password
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/razor-primary-realm.json:/opt/keycloak/data/import/razor-primary-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24
  # Second, independent Keycloak instance: http://localhost:8081, realm razor-secondary.
  keycloak-secondary:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-password
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/razor-secondary-realm.json:/opt/keycloak/data/import/razor-secondary-realm.json:ro
      - keycloak-secondary-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24
  razor:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Public issuer is localhost; the container fetches discovery/keys through the service names.
      Keycloak__Primary__Authority: http://localhost:8080/realms/razor-primary
      Keycloak__Primary__MetadataAddress: http://keycloak:8080/realms/razor-primary/.well-known/openid-configuration
      Keycloak__Secondary__Authority: http://localhost:8081/realms/razor-secondary
      Keycloak__Secondary__MetadataAddress: http://keycloak-secondary:8080/realms/razor-secondary/.well-known/openid-configuration
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - razor-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-secondary:
        condition: service_healthy
volumes:
  keycloak-data:
  keycloak-secondary-data:
  razor-keys:
